[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "General-purpose multi-agent data analyst with human-in-the-loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langchain-openai>=1.7.3",
    "langchain-core>=1.7.1",
    "mcp>=2.3.0",
    "sqlglot>=30.25.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
]

[project.scripts]
analyst = "analyst.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # long lines are fine in SQL strings and prompts

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs the docker-compose databases running"]

[tool.mypy]
packages = ["analyst"]
mypy_path = "src"
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = false
ignore_missing_imports = true
